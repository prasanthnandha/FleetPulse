[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fleetpulse"
version = "0.1.0"
description = "Agentic MDM system — predicts device health degradation, retrieves repair info via RAG, and drafts remediation tickets through a conversational UI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Prasanth"},
]

dependencies = [
    # Data & Spark
    "pyspark>=3.5.0",
    "delta-spark>=3.1.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",

    # ML
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "scikit-learn>=1.3.0",
    "mlflow>=2.10.0",

    # Embeddings & RAG
    "sentence-transformers>=2.3.0",
    "tiktoken>=0.5.0",

    # Agent / LLM
    "anthropic>=0.39.0",
    "openai>=1.12.0",

    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "sse-starlette>=1.8.0",
    "python-dotenv>=1.0.0",

    # HTTP
    "requests>=2.31.0",
    "httpx>=0.27.0",

    # Databricks
    "databricks-sdk>=0.20.0",
    "databricks-vectorsearch>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ipykernel>=6.27.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
